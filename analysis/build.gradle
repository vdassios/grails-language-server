// Runs inside a class loader per project module, next to the project's own Groovy and Grails jars,
// so Groovy is compileOnly: compiled against the lowest supported API (2.5), never bundled.
// Only `api` types cross into `server`.
def groovyApi = "org.codehaus.groovy:groovy:2.5.23"

dependencies {
  compileOnly groovyApi
  compileOnly project(":api")
  testImplementation groovyApi
  testImplementation project(":api")
}

// The same tests on Groovy 3 (Grails 5, 6), 4 (Grails 7) and 5 (Grails 8): the jar compiled against 2.5 must also
// run there. Versions as in the docs/editors.md table.
def groovyRuntimes = [
  groovy3: "org.codehaus.groovy:groovy:3.0.23",
  groovy4: "org.apache.groovy:groovy:4.0.33",
  groovy5: "org.apache.groovy:groovy:5.1.3",
]
// Grails 8's g: taglibs (FormTagLib, ValidationTagLib, ...), Java 21 class files declaring tags as methods: TaglibsTest
// reads them as the server reads a Grails 8 project's jars. The jar alone, never on a class path.
configurations {
  grails8Taglibs { transitive = false }
}
dependencies {
  grails8Taglibs "org.apache.grails:grails-gsp:8.0.0"
}
tasks.withType(Test).configureEach {
  def taglibs = configurations.grails8Taglibs
  inputs.files(taglibs).withPropertyName("grails8Taglibs").withNormalizer(ClasspathNormalizer)
  jvmArgumentProviders.add({ ["-Dgrails8.taglibs=${taglibs.singleFile}".toString()] } as CommandLineArgumentProvider)
}

groovyRuntimes.each { name, coordinates ->
  def configuration = configurations.create(name)
  dependencies.add(name, coordinates)
  def major = name - "groovy"
  def task = tasks.register("testGroovy${major}", Test) {
    description = "Runs the tests on Groovy ${major} instead of 2.5."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith("groovy-2.") } + configuration
    useJUnitPlatform()
  }
  tasks.named("check") { dependsOn task }
}
