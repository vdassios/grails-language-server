// Runs inside a class loader per project module, next to the project's own Groovy and Grails jars,
// so Groovy is compileOnly: compiled against the lowest supported API (2.5), never bundled.
// The lsp4j types in the providers are inherited from groovy-language-server and are replaced by
// plain data objects owned by `server` when this layer is wired in (milestone M1).
def groovyApi = "org.codehaus.groovy:groovy:2.5.23"

dependencies {
  compileOnly groovyApi
  testImplementation groovyApi
  implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:0.12.0"
  implementation "org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.12.0"
  implementation "com.google.code.gson:gson:2.13.1"
  implementation "io.github.classgraph:classgraph:4.8.179"
}

// The same tests on Groovy 4 (Grails 7): the jar compiled against 2.5 must also run there.
configurations { groovy4 }
dependencies { groovy4 "org.apache.groovy:groovy:4.0.33" }

def testGroovy4 = tasks.register("testGroovy4", Test) {
  description = "Runs the tests on Groovy 4 instead of 2.5."
  group = "verification"
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith("groovy-2.") } + configurations.groovy4
  useJUnitPlatform()
}
tasks.named("check") { dependsOn testGroovy4 }
