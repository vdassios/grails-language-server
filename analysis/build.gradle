// Runs inside a class loader per project module, next to the project's own Groovy and Grails jars,
// so Groovy is compileOnly: compiled against the lowest supported API (2.5), never bundled.
// Only `api` types cross into `server`.
def groovyApi = "org.codehaus.groovy:groovy:2.5.23"

dependencies {
  compileOnly groovyApi
  compileOnly project(":api")
  testImplementation groovyApi
  testImplementation project(":api")
}

// The same tests on Groovy 3 (Grails 5, 6), 4 (Grails 7) and 5 (Grails 8): the jar compiled against 2.5 must also
// run there. Versions as in the docs/editors.md table.
def groovyRuntimes = [
  groovy3: "org.codehaus.groovy:groovy:3.0.23",
  groovy4: "org.apache.groovy:groovy:4.0.33",
  groovy5: "org.apache.groovy:groovy:5.1.3",
]
// Grails 8's g: taglibs (FormTagLib, ValidationTagLib, ...), Java 21 class files declaring tags as methods: TaglibsTest
// reads them as the server reads a Grails 8 project's jars. The jar alone, never on a class path.
configurations {
  grails8Taglibs { transitive = false }
}
dependencies {
  grails8Taglibs "org.apache.grails:grails-gsp:8.0.0"
}
// Grails 8's page parser and scanner, Java 21 class files: GspTranslationTest reads from the scanner's class file
// whether it escapes \${, as the server reads it from a project's class path. The jar alone, never on a class path.
configurations {
  grails8Gsp { transitive = false }
}
dependencies {
  grails8Gsp "org.apache.grails.views:grails-gsp-core:8.0.0"
}
// Grails's GSP page parser as the Grails 4 and Grails 7 fixtures have it, with what it needs (its own Groovy):
// GspTranslationTest runs it in a class loader of its own, as the server runs a project's.
configurations {
  grails4Gsp
  grails7Gsp
}
dependencies {
  grails4Gsp platform("org.grails:grails-bom:4.1.4")
  grails4Gsp "org.grails:grails-gsp:4.0.3"
  grails7Gsp platform("org.apache.grails:grails-bom:7.2.4")
  grails7Gsp "org.apache.grails.views:grails-gsp-core"
}
tasks.withType(Test).configureEach {
  def taglibs = configurations.grails8Taglibs
  def gsp4 = configurations.grails4Gsp
  def gsp7 = configurations.grails7Gsp
  def gsp8 = configurations.grails8Gsp
  inputs.files(taglibs).withPropertyName("grails8Taglibs").withNormalizer(ClasspathNormalizer)
  inputs.files(gsp4).withPropertyName("grails4Gsp").withNormalizer(ClasspathNormalizer)
  inputs.files(gsp7).withPropertyName("grails7Gsp").withNormalizer(ClasspathNormalizer)
  inputs.files(gsp8).withPropertyName("grails8Gsp").withNormalizer(ClasspathNormalizer)
  jvmArgumentProviders.add({ ["-Dgrails8.taglibs=${taglibs.singleFile}".toString(), "-Dgrails4.gsp=${gsp4.asPath}".toString(),
      "-Dgrails7.gsp=${gsp7.asPath}".toString(), "-Dgrails8.gsp=${gsp8.singleFile}".toString()] } as CommandLineArgumentProvider)
}

groovyRuntimes.each { name, coordinates ->
  def configuration = configurations.create(name)
  dependencies.add(name, coordinates)
  def major = name - "groovy"
  def task = tasks.register("testGroovy${major}", Test) {
    description = "Runs the tests on Groovy ${major} instead of 2.5."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith("groovy-2.") } + configuration
    useJUnitPlatform { excludeTags "jdk17" }
  }
  tasks.named("check") { dependsOn task }
}

// Tests tagged jdk17 run Grails 7's page parser, whose classes need Java 17: on the JDK in GLS_TEST_JDK17, else
// Gradle's (17 or later), never on -PtestJavaHome.
test {
  useJUnitPlatform { excludeTags "jdk17" }
}
def testJdk17 = tasks.register("testJdk17", Test) {
  description = "Runs the tests tagged jdk17 on the JDK in GLS_TEST_JDK17."
  group = "verification"
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags "jdk17" }
  def jdk17 = System.getenv("GLS_TEST_JDK17")
  if (jdk17) {
    executable = "${jdk17}/bin/java"
  }
  inputs.property("jdk17", jdk17.toString())
}
tasks.named("check") { dependsOn testJdk17 }
