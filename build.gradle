plugins {
  id "base"
  id "com.gradleup.shadow" version "8.3.6" apply false
}

subprojects {
  apply plugin: "java"

  repositories {
    mavenCentral()
  }

  // Bytecode for Java 11: the server runs on the project's JDK, and old Groovy needs an old JDK.
  tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = "UTF-8"
  }

  dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.14.1"
  }

  test {
    useJUnitPlatform()
  }

  // -PtestJavaHome=<jdk>: run the tests on another JDK, e.g. 11, the oldest the server runs on.
  // Not testJdk17 (server) or testGroovy6 (analysis), which run on GLS_TEST_JDK17.
  tasks.withType(Test).configureEach {
    if (project.hasProperty("testJavaHome") && !(name in ["testJdk17", "testGroovy6"])) {
      executable = "${project.property("testJavaHome")}/bin/java"
    }
  }
}
