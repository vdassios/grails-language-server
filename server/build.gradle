// LSP endpoints, project model and scheduling. No Groovy dependency: Groovy code runs only in `analysis`.
apply plugin: "com.gradleup.shadow"

def mainClassName = "io.github.vdassios.grailsls.GrailsLanguageServer"

dependencies {
  implementation project(":api")
  implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:0.12.0"
  implementation "org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.12.0"
  implementation "com.google.code.gson:gson:2.13.1"
}

// The analysis layer is loaded by each module loader, not by the server's: ship it as a nested jar (AnalysisJar).
// Not named *.jar: the shadow plugin would unpack it into the server's own classes.
processResources {
  from(project(":analysis").tasks.named("jar")) {
    into "io/github/vdassios/grailsls/compile"
    rename { "analysis.bin" }
  }
}

// Implementation-Version: the server's version, reported as serverInfo.version.
jar {
  manifest { attributes "Main-Class": mainClassName, "Implementation-Version": project.version }
}

shadowJar {
  archiveBaseName = "grails-language-server"
  archiveClassifier = "all"
  archiveVersion = "" // the name releases and editors expect; the version is in the manifest
  destinationDirectory = rootProject.layout.buildDirectory.dir("libs")
  // ParserCache shares ANTLR's parser cache by writing a final field: JDK 26+ warns about that (JEP 500) unless the
  // executable jar allows it. Older JDKs ignore the attribute.
  manifest { attributes "Main-Class": mainClassName, "Implementation-Version": project.version, "Enable-Final-Field-Mutation": "ALL-UNNAMED" }
}

tasks.named("build") { dependsOn tasks.named("shadowJar") }

// A Groovy jar for module loaders in tests that need no Gradle build (the server itself has no Groovy), and one whose
// ASM reads class files up to Java 15 only, for the check that the project's Groovy can read the JDK's.
configurations { testGroovy; testGroovyOldAsm }
dependencies {
  testGroovy "org.codehaus.groovy:groovy:2.5.23"
  testGroovyOldAsm "org.codehaus.groovy:groovy:2.5.14"
}
// The server jar, for the test that reads serverInfo.version from its manifest.
def serverJar = tasks.named("shadowJar")
tasks.withType(Test).configureEach {
  inputs.files(configurations.testGroovy).withPropertyName("testGroovy")
  inputs.files(configurations.testGroovyOldAsm).withPropertyName("testGroovyOldAsm")
  inputs.files(serverJar).withPropertyName("serverJar")
  def groovyJars = configurations.testGroovy
  def oldAsmJars = configurations.testGroovyOldAsm
  def jarFiles = serverJar.map { it.outputs.files }
  def serverVersion = project.version.toString()
  // the analysis tests' finder table, which FinderTableTest checks against each fixture's GORM
  def finderNames = project(":analysis").file("src/test/resources/finder-names.txt")
  inputs.file(finderNames).withPropertyName("finderNames")
  jvmArgumentProviders.add({ ["-Dgls.testGroovy=${groovyJars.singleFile}", "-Dgls.testGroovyOldAsm=${oldAsmJars.singleFile}",
      "-Dgls.serverJar=${jarFiles.get().singleFile}", "-Dgls.version=${serverVersion}", "-Dgls.finderNames=${finderNames}"] } as CommandLineArgumentProvider)
}

test {
  // FixtureModelTest builds the projects under fixtures/ with JDKs from GLS_TEST_JDK11 and GLS_TEST_JDK17.
  systemProperty "gls.fixtures", rootProject.file("fixtures").absolutePath
  inputs.dir(rootProject.file("fixtures")).withPropertyName("fixtures")
  inputs.property("jdks", [System.getenv("GLS_TEST_JDK11"), System.getenv("GLS_TEST_JDK17")].toString())
  useJUnitPlatform { excludeTags "perf", "jdk17" }
}
// Tests tagged jdk17 compile the Grails 7 fixture in-process (its classes need Java 17), or need a JDK newer than Groovy
// 2.5.14 reads: they run on GLS_TEST_JDK17 (the fixture tests are skipped without it).
def testJdk17 = tasks.register("testJdk17", Test) {
  description = "Runs the tests tagged jdk17 on the JDK in GLS_TEST_JDK17."
  group = "verification"
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags "jdk17" }
  def jdk17 = System.getenv("GLS_TEST_JDK17")
  if (jdk17) {
    executable = "${jdk17}/bin/java"
  }
  systemProperty "gls.fixtures", rootProject.file("fixtures").absolutePath
  inputs.dir(rootProject.file("fixtures")).withPropertyName("fixtures")
  inputs.property("jdk17", jdk17.toString())
}
tasks.named("check") { dependsOn testJdk17 }

// Latency against the performance budget (LatencyTest): slow, and machine-dependent, so never part of `build`.
// GLS_PERF_PROJECT=<built project> measures that project instead of the grails4 fixture.
tasks.register("perfTest", Test) {
  description = "Measures query latency on the grails4 fixture or GLS_PERF_PROJECT."
  group = "verification"
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform { includeTags "perf" }
  systemProperty "gls.fixtures", rootProject.file("fixtures").absolutePath
  testLogging { showStandardStreams = true }
  outputs.upToDateWhen { false }
  // The heap `java -jar` gives the server (a quarter of the RAM), not Gradle's 512 MB test default, under which large
  // projects spend their time in GC or run out. GLS_PERF_HEAP (e.g. 2g) sets another.
  maxHeapSize = System.getenv("GLS_PERF_HEAP") ?: "${java.lang.management.ManagementFactory.operatingSystemMXBean.totalMemorySize >> 22}m"
}
