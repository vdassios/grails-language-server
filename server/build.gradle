// LSP endpoints, project model and scheduling. No Groovy dependency: Groovy code runs only in `analysis`.
apply plugin: "com.gradleup.shadow"

def mainClassName = "io.github.vdassios.grailsls.GrailsLanguageServer"

dependencies {
  implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:0.12.0"
  implementation "org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.12.0"
  implementation "com.google.code.gson:gson:2.13.1"
}

jar {
  manifest { attributes "Main-Class": mainClassName }
}

shadowJar {
  archiveBaseName = "grails-language-server"
  archiveClassifier = "all"
  destinationDirectory = rootProject.layout.buildDirectory.dir("libs")
  manifest { attributes "Main-Class": mainClassName }
}

tasks.named("build") { dependsOn tasks.named("shadowJar") }

test {
  // FixtureModelTest builds the projects under fixtures/ with JDKs from GLS_TEST_JDK11 and GLS_TEST_JDK17.
  systemProperty "gls.fixtures", rootProject.file("fixtures").absolutePath
  inputs.dir(rootProject.file("fixtures")).withPropertyName("fixtures")
  inputs.property("jdks", [System.getenv("GLS_TEST_JDK11"), System.getenv("GLS_TEST_JDK17")].toString())
}
