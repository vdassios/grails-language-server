// grails-language-server: writes one JSON record per Gradle project into the directory given as -Pgls.out.
// Resolves dependencies only; builds nothing. Works on Gradle 5 to 9.
// A second task, grailsLanguageServerSources, downloads the sources jars of the compile classpaths' libraries (and of
// main's runtime classpath) into Gradle's own cache and writes what it found, also one JSON record per project.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedComponentResult
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.util.GradleVersion

allprojects { p ->
  def task = p.tasks.create('grailsLanguageServerModel')
  if (GradleVersion.current() >= GradleVersion.version('7.4')) {
    task.notCompatibleWithConfigurationCache('reads the project model at execution time')
  }
  task.doLast {
    def out = new File(p.rootProject.findProperty('gls.out') as String)
    def record = [path: p.path, name: p.name, projectDir: p.projectDir.absolutePath, buildDir: p.layout.buildDirectory.get().asFile.absolutePath, groovyVersion: null, dependsOn: [], sourceSets: [], errors: []]
    def sourceSets = p.extensions.findByName('sourceSets')
    sourceSets?.each { ss ->
      def conf = p.configurations.findByName(ss.compileClasspathConfigurationName)
      def classpath = []
      if (conf != null) {
        def artifacts = conf.incoming.artifactView { lenient(true) }.artifacts
        artifacts.each { a ->
          classpath << a.file.absolutePath
          def id = a.id.componentIdentifier
          if (id instanceof ModuleComponentIdentifier && id.module in ['groovy', 'groovy-all'] && id.group in ['org.codehaus.groovy', 'org.apache.groovy']) {
            record.groovyVersion = record.groovyVersion ?: id.version
          }
          if (id instanceof ProjectComponentIdentifier && id.projectPath != p.path && !(id.projectPath in record.dependsOn)) {
            record.dependsOn << id.projectPath
          }
        }
        artifacts.failures.each { f -> record.errors << "${ss.name}: ${f.message}".toString() }
      }
      // other source sets whose output a build script adds to this one's classpath (Grails: integrationTest gets test's);
      // such additions are not in the configuration. Resolving the whole classpath is strict: on a failure, none listed
      def outputsOf = []
      try {
        def files = ss.compileClasspath.files
        outputsOf = sourceSets.findAll { o -> o.name != ss.name && o.output.classesDirs.files.any { it in files } }*.name
      } catch (Exception ignored) {
      }
      // jars only on main's runtime classpath: GSP pages compile at run time, so taglibs there count (Grails 7: RenderTagLib)
      def runtimeOnly = []
      def runtime = ss.name == 'main' ? p.configurations.findByName(ss.runtimeClasspathConfigurationName) : null
      if (runtime != null) {
        def runtimeArtifacts = runtime.incoming.artifactView { lenient(true) }.artifacts
        runtimeArtifacts.each { a ->
          def path = a.file.absolutePath
          if (path.endsWith('.jar') && !(path in classpath) && !(a.id.componentIdentifier instanceof ProjectComponentIdentifier)) {
            runtimeOnly << path
          }
        }
        runtimeArtifacts.failures.each { f -> record.errors << "${ss.name} runtime: ${f.message}".toString() }
      }
      def resourceDirs = ss.resources.srcDirs
      record.sourceSets << [
        name: ss.name,
        sourceRoots: (ss.allSource.srcDirs - resourceDirs)*.absolutePath.sort(),
        resourceRoots: resourceDirs*.absolutePath.sort(),
        compileClasspath: classpath,
        classesDirs: ss.output.classesDirs.files*.absolutePath.sort(),
        outputsOf: outputsOf,
        runtimeOnly: runtimeOnly,
      ]
    }
    def file = p.path == ':' ? '_root' : p.path.substring(1).replace(':', '__')
    new File(out, file + '.json').text = JsonOutput.toJson(record)
  }

  def sources = p.tasks.create('grailsLanguageServerSources')
  if (GradleVersion.current() >= GradleVersion.version('7.4')) {
    sources.notCompatibleWithConfigurationCache('resolves artifacts at execution time')
  }
  sources.doLast {
    def out = new File(p.rootProject.findProperty('gls.out') as String)
    def ids = [] as LinkedHashSet
    p.extensions.findByName('sourceSets')?.each { ss ->
      // main's runtime classpath too: its runtime-only jars hold taglibs (the model's runtimeOnly)
      def names = ss.name == 'main' ? [ss.compileClasspathConfigurationName, ss.runtimeClasspathConfigurationName] : [ss.compileClasspathConfigurationName]
      names.collect { p.configurations.findByName(it) }.findAll { it != null }.each { conf ->
        conf.incoming.artifactView { lenient(true) }.artifacts.each { a ->
          if (a.id.componentIdentifier instanceof ModuleComponentIdentifier) {
            ids << a.id.componentIdentifier
          }
        }
      }
    }
    // available: a sources jar is on disk now; unavailable: the library publishes none; failed: could not be fetched
    def record = [path: p.path, available: [], unavailable: [], failed: [], failure: null]
    if (!ids.isEmpty()) {
      def result = p.dependencies.createArtifactResolutionQuery().forComponents(ids).withArtifacts(JvmLibrary, SourcesArtifact).execute()
      result.components.each { c ->
        def name = c.id.displayName
        if (c instanceof UnresolvedComponentResult) {
          record.failed << name
          record.failure = record.failure ?: c.failure?.message
          return
        }
        def artifacts = c.getArtifacts(SourcesArtifact)
        def broken = artifacts.find { it instanceof UnresolvedArtifactResult && !it.failure?.class?.name?.contains('NotFound') }
        if (artifacts.any { it instanceof ResolvedArtifactResult && it.file.isFile() }) {
          record.available << name
        } else if (broken != null) {
          record.failed << name
          record.failure = record.failure ?: broken.failure?.message
        } else {
          record.unavailable << name
        }
      }
    }
    def file = p.path == ':' ? '_root' : p.path.substring(1).replace(':', '__')
    new File(out, file + '.json').text = JsonOutput.toJson(record)
  }
}
