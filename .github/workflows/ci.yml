name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 11: the oldest JDK the server runs on, and the Grails 4 fixture's. 17 (listed last, so the default):
      # runs Gradle 9 for this build, and the Grails 7 and plain Groovy fixtures.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test (tests on JDK 11)
        env:
          GLS_TEST_JDK11: ${{ env.JAVA_HOME_11_X64 }}
          GLS_TEST_JDK17: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew build -PtestJavaHome="$JAVA_HOME_11_X64"
      - name: No test skipped (the fixture tests skip without their JDK)
        run: |
          if grep -l 'skipped="[1-9]' */build/test-results/*/*.xml; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: grails-language-server-all
          path: build/libs/grails-language-server-all.jar
          if-no-files-found: error
